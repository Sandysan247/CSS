<html>

<head>
    <style>
        div {
            right: 30px;
            border: 3px solid black;
        }

        div.absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;
        }

        div.relative {
            position: relative;
            left: 100px;
            border: 3px solid #73ad21;
        }

        div.fixed {
            position: fixed;
            top: 0;
            right: 20px;
            width: 300px;
            border: 3px solid #73ad21;
        }
    </style>
</head>
<body>
    <h2>CSS Positioning</h2>
    <p>In the following example, we have four div elements with different position values:</p>

    <div>This div element is positioned static (default).</div>
    <br>
    <div class="sticky">This div element is positioned sticky.</div>
    <br>
    <div class="relative">This div element is positioned relative.</div>
    <br>
    <div class="absolute">This div element is positioned absolute.</div>
</body>
</html>
