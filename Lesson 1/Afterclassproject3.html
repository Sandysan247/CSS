<!DOCTYPE html>
<html>

<head>
    <title>HTML Tags Table</title>
    <style>
        body {
            background-color: #f2f6ff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #2b2e4a;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 70%;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #4b7bec;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

    <h1>HTML Tags and Their Functions</h1>

    <table>
        <tr>
            <th>HTML Tag</th>
            <th>Function</th>
        </tr>
        <tr>
            <td>&lt;html&gt;</td>
            <td>Starts the HTML document</td>
        </tr>
        <tr>
            <td>&lt;head&gt;</td>
            <td>Contains page information</td>
        </tr>
        <tr>
            <td>&lt;title&gt;</td>
            <td>Shows the title on the browser tab</td>
        </tr>
        <tr>
            <td>&lt;body&gt;</td>
            <td>Displays content on the webpage</td>
        </tr>
        <tr>
            <td>&lt;h1&gt;</td>
            <td>Largest heading</td>
        </tr>
        <tr>
            <td>&lt;p&gt;</td>
            <td>Used to write a paragraph</td>
        </tr>
        <tr>
            <td>&lt;a&gt;</td>
            <td>Creates a link</td>
        </tr>
        <tr>
            <td>&lt;img&gt;</td>
            <td>Displays an image</td>
        </tr>
    </table>

</body>

</html>
