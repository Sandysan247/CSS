<html>
<head>
    <title>Learn To Transform</title>
    <style>
        div {
            width: 300px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
        }
        #myDiv {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <h1>Welcome To Codingal</h1>
    <div>
        <p>Ready To Learn To rotate a div</p>
    </div>
    <div id="myDiv">
        <p>Ready To Learn To rotate a div</p>
    </div>
</body>
</html>
