<!DOCTYPE html>
<html>

<head>
    <title>Columns</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        .box {
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello students</h1>
        <p>Resize the browser window to see the effect.</p>

        <!-- Row 1 -->
        <div class="row">
            <div class="col-md-8 col-4 box" style="background-color:red;">
                col-md-8 col-4
            </div>

            <div class="col-md-4 col-8 box" style="background-color:lavender;">
                col-md-4 col-8
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row">
            <div class="col-md-12 col-6 box" style="background-color:lavenderblush;">
                col-md-6 col-6
            </div>

            <div class="col-xs-2 col-6 box" style="background-color:lightgrey;">
                col-xs-2 col-6
            </div>
        </div>

        <!-- Row 3 -->
        <div class="row" style="background-color:lightcyan;">
            <div class="col-xs-6 box">
                col-xs-6
            </div>

            <div class="col-xs-6 box">
                col-xs-6
            </div>
